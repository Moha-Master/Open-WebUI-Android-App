name: Build and Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Android repo
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Checkout OWUI repo
      uses: actions/checkout@v4
      with:
        repository: ${{ vars.OWUI_REPO || 'Moha-Master/open-webui' }}
        ref: main
        path: owui

    - name: Build OWUI frontend
      run: |
        cd owui
        npm ci
        npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Sync OWUI assets to Android project
      run: |
        rm -rf app/src/main/assets/webui
        mkdir -p app/src/main/assets
        cp -r owui/build app/src/main/assets/webui
        # aapt2 strips underscore-prefixed directories
        if [ -d "app/src/main/assets/webui/_app" ]; then
          mv app/src/main/assets/webui/_app app/src/main/assets/webui/app_chunks
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Prepare keystore
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: |
        echo "$SIGNING_KEY" | base64 -d > release.jks
        echo "KEYSTORE_PATH=$(pwd)/release.jks" >> $GITHUB_ENV

    - name: Build Release APK (signed)
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
